<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body { background-color: #f8fafc; color: #0f172a; }
    [v-cloak] { display: none; }
  </style>
</head>
<body class="p-8 font-sans">
  <div id="app" class="max-w-4xl mx-auto" v-cloak>
    
    <!-- Login Screen -->
    <div v-if="!user" class="flex flex-col items-center justify-center min-h-[50vh]">
      <h1 class="text-3xl font-bold text-blue-600 mb-6">Admin Login</h1>
      <p class="text-gray-600 mb-6 text-center max-w-md">Please sign in with your authorized Google account to manage your portfolio.</p>
      <button @click="signIn" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 transition flex items-center font-medium">
        <i class='bx bxl-google mr-2 text-xl'></i> Sign in with Google
      </button>
      <p v-if="loginError" class="text-red-500 mt-4">{{ loginError }}</p>
    </div>

    <!-- Dashboard -->
    <div v-else>
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-blue-600">Admin Dashboard</h1>
          <p class="text-sm text-gray-500 mt-1">Signed in as: {{ user.email }} <button @click="signOut" class="text-blue-500 hover:underline ml-2">Sign out</button></p>
        </div>
        <button @click="saveData" :disabled="saving" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition disabled:opacity-50 flex items-center">
          <i v-if="saving" class='bx bx-loader-alt bx-spin mr-2'></i>
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

      <div v-if="loading" class="text-gray-500 py-10 text-center">Loading data from Firebase...</div>
      
      <div v-else>
        <!-- Contact Details -->
        <div class="mb-10">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">Contact Details</h2>
          <div class="bg-white p-6 rounded-lg shadow-sm border">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Link</label>
                <input v-model="data.contact.github" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Text (e.g., github.com/user)</label>
                <input v-model="data.contact.githubText" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input v-model="data.contact.email" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn Link</label>
                <input v-model="data.contact.linkedin" type="text" class="w-full border rounded p-2">
              </div>
            </div>
          </div>
        </div>

        <!-- Skills -->
        <div class="mb-10">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">Skills</h2>
          <div v-for="(skill, index) in data.skills" :key="'s'+index" class="bg-white p-6 rounded-lg shadow-sm border mb-6 relative">
            <button @click="removeSkill(index)" class="absolute top-4 right-4 text-red-500 hover:text-red-700">
              <i class='bx bx-trash text-xl'></i>
            </button>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input v-model="skill.name" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Icon (Boxicons class)</label>
                <div class="flex items-center">
                  <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                    <i :class="['bx', skill.icon, 'text-xl']"></i>
                  </div>
                  <input v-model="skill.icon" type="text" class="w-full border rounded-r p-2 h-10" placeholder="e.g. bx-code-block">
                </div>
              </div>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea v-model="skill.description" rows="2" class="w-full border rounded p-2"></textarea>
            </div>
            
            <div class="mb-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
              <div class="flex flex-wrap gap-2 mb-2">
                <div v-for="(tag, tIndex) in skill.tags" :key="'st'+tIndex" class="flex items-center bg-gray-100 border rounded pl-2">
                  <i :class="['bx', tag.icon, 'text-gray-500 mr-1']"></i>
                  <input v-model="tag.icon" placeholder="Icon class" class="w-24 bg-transparent text-xs outline-none py-1">
                  <input v-model="tag.name" placeholder="Name" class="w-24 bg-transparent text-xs font-semibold outline-none py-1 border-l pl-2">
                  <button @click="skill.tags.splice(tIndex, 1)" class="text-red-500 px-2 hover:bg-red-100 rounded-r"><i class='bx bx-x'></i></button>
                </div>
                <button @click="skill.tags.push({icon: '', name: ''})" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">+ Add Tag</button>
              </div>
            </div>
          </div>
          <button @click="addSkill" class="w-full border-2 border-dashed border-gray-300 text-gray-500 hover:border-blue-500 hover:text-blue-500 py-4 rounded-lg flex items-center justify-center font-medium transition">
            <i class='bx bx-plus text-xl mr-2'></i> Add New Skill
          </button>
        </div>

        <!-- Projects -->
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Projects</h2>
        
        <div v-for="(project, index) in data.projects" :key="'p'+index" class="bg-white p-6 rounded-lg shadow-sm border mb-6 relative">
          <button @click="removeProject(index)" class="absolute top-4 right-4 text-red-500 hover:text-red-700">
            <i class='bx bx-trash text-xl'></i>
          </button>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
              <input v-model="project.title" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Image URL</label>
              <input v-model="project.image" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link (leave empty if none)</label>
              <input v-model="project.link" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link Text (e.g., View Project)</label>
              <input v-model="project.linkText" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link Icon (Boxicons class)</label>
              <div class="flex items-center">
                <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                  <i :class="['bx', project.linkIcon, 'text-xl']"></i>
                </div>
                <input v-model="project.linkIcon" type="text" class="w-full border rounded-r p-2 h-10">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status (e.g., Hibernating)</label>
              <input v-model="project.status" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Card Icon (Boxicons class)</label>
              <div class="flex items-center">
                <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                  <i :class="['bx', project.icon, 'text-xl']"></i>
                </div>
                <input v-model="project.icon" type="text" class="w-full border rounded-r p-2 h-10">
              </div>
            </div>
            <div class="flex items-center pt-6">
              <input v-model="project.featured" type="checkbox" class="mr-2 h-5 w-5 text-blue-600">
              <label class="text-sm font-medium text-gray-700">Featured (Shows Star badge)</label>
            </div>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea v-model="project.description" rows="3" class="w-full border rounded p-2"></textarea>
          </div>
          
          <div class="mb-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Technologies (Tags)</label>
            <div class="flex flex-wrap gap-2 mb-2">
              <div v-for="(tag, tIndex) in project.tags" :key="tIndex" class="flex items-center bg-gray-100 border rounded pl-2">
                <i :class="['bx', tag.icon, 'text-gray-500 mr-1']"></i>
                <input v-model="tag.icon" placeholder="Icon class" class="w-24 bg-transparent text-xs outline-none py-1">
                <input v-model="tag.name" placeholder="Name" class="w-24 bg-transparent text-xs font-semibold outline-none py-1 border-l pl-2">
                <button @click="project.tags.splice(tIndex, 1)" class="text-red-500 px-2 hover:bg-red-100 rounded-r"><i class='bx bx-x'></i></button>
              </div>
              <button @click="project.tags.push({icon: '', name: ''})" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">+ Add Tag</button>
            </div>
          </div>
        </div>
        
        <button @click="addProject" class="w-full border-2 border-dashed border-gray-300 text-gray-500 hover:border-blue-500 hover:text-blue-500 py-4 rounded-lg flex items-center justify-center font-medium transition">
          <i class='bx bx-plus text-xl mr-2'></i> Add New Project
        </button>
      </div>
    </div>
  </div>

  <!-- Load Firebase config -->
  <script src="/firebase-applet-config.json" id="firebase-config-json" type="application/json"></script>
  <script type="module">
    import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Load Firebase Config dynamically
    fetch('/firebase-applet-config.json')
      .then(res => res.json())
      .then(firebaseConfig => {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
        const auth = getAuth(app);

        createApp({
          setup() {
            const user = ref(null);
            const loading = ref(false);
            const saving = ref(false);
            const loginError = ref('');
            const data = ref({ projects: [], skills: [], contact: {} });

            onMounted(() => {
              onAuthStateChanged(auth, (u) => {
                user.value = u;
                if (u) {
                  loadData();
                }
              });
            });

            const signIn = async () => {
              loginError.value = '';
              const provider = new GoogleAuthProvider();
              try {
                await signInWithPopup(auth, provider);
              } catch (e) {
                loginError.value = e.message;
              }
            };

            const signOut = async () => {
              await fbSignOut(auth);
              data.value = { projects: [], skills: [], contact: {} };
            };

            const loadData = async () => {
              loading.value = true;
              try {
                const docRef = doc(db, 'portfolio', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                  const fetchedData = docSnap.data();
                  if(fetchedData.projects) data.value.projects = fetchedData.projects;
                  if(fetchedData.skills) data.value.skills = fetchedData.skills;
                  if(fetchedData.contact) data.value.contact = fetchedData.contact;
                }
              } catch (e) {
                console.error('Failed to load data from Firebase', e);
                alert("Error loading data. Are you authorized? " + e.message);
              } finally {
                loading.value = false;
              }
            };

            const saveData = async () => {
              saving.value = true;
              try {
                const docRef = doc(db, 'portfolio', 'data');
                
                // Deep clone data to strip out vue proxies for firebase saving
                const pureData = JSON.parse(JSON.stringify(data.value));
                await setDoc(docRef, pureData);
                
                alert('Changes saved securely to Firebase!');
              } catch (e) {
                console.error(e);
                alert('Error saving data: ' + e.message);
              } finally {
                saving.value = false;
              }
            };

            const addProject = () => {
              data.value.projects.push({
                title: '', image: '', link: '', linkText: '', linkIcon: '', status: '', description: '', tags: [], icon: '', featured: false
              });
            };

            const removeProject = (index) => {
              if(confirm('Are you sure you want to delete this project?')) {
                data.value.projects.splice(index, 1);
              }
            };

            const addSkill = () => {
              data.value.skills.push({ name: '', icon: '', description: '', tags: [] });
            };

            const removeSkill = (index) => {
              if(confirm('Are you sure you want to delete this skill?')) {
                data.value.skills.splice(index, 1);
              }
            };

            return {
              user,
              loading,
              saving,
              loginError,
              data,
              signIn,
              signOut,
              saveData,
              addProject,
              removeProject,
              addSkill,
              removeSkill
            }
          }
        }).mount('#app');
      })
      .catch(e => {
        console.error("Could not load firebase config", e);
        document.body.innerHTML = "<h2 style='color:red; text-align:center; padding: 50px'>Failed to load Firebase Config</h2>";
      });
  </script>
</body>
</html>
