<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body { background-color: #f8fafc; color: #0f172a; }
    [v-cloak] { display: none; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>
<body class="p-8 font-sans">
  <div id="app" class="max-w-7xl mx-auto" v-cloak>
    
    <!-- Login Screen -->
    <div v-if="!user" class="flex flex-col items-center justify-center min-h-[50vh]">
      <h1 class="text-3xl font-bold text-blue-600 mb-6">Admin Login</h1>
      <p class="text-gray-600 mb-6 text-center max-w-md">Please sign in with your authorized Google account to manage your portfolio.</p>
      <button @click="signIn" class="bg-blue-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 transition flex items-center font-medium">
        <i class='bx bxl-google mr-2 text-xl'></i> Sign in with Google
      </button>
      <p v-if="loginError" class="text-red-500 mt-4">{{ loginError }}</p>
    </div>

    <!-- Dashboard -->
    <div v-else>
      <div class="flex justify-between items-center mb-8">
        <div>
          <h1 class="text-3xl font-bold text-blue-600">Admin Dashboard</h1>
          <p class="text-sm text-gray-500 mt-1">Signed in as: {{ user.email }} <button @click="signOut" class="text-blue-500 hover:underline ml-2">Sign out</button></p>
        </div>
        <button @click="saveData" :disabled="saving" class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition disabled:opacity-50 flex items-center">
          <i v-if="saving" class='bx bx-loader-alt bx-spin mr-2'></i>
          {{ saving ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>

      <div v-if="loading" class="text-gray-500 py-10 text-center">Loading data from Firebase...</div>
      
      <div v-else>
        <!-- Contact Details -->
        <div class="mb-10">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">Contact Details</h2>
          <div class="bg-white p-6 rounded-lg shadow-sm border">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Link</label>
                <input v-model="data.contact.github" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub Text (e.g., github.com/user)</label>
                <input v-model="data.contact.githubText" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input v-model="data.contact.email" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">LinkedIn Link</label>
                <input v-model="data.contact.linkedin" type="text" class="w-full border rounded p-2">
              </div>
            </div>
          </div>
        </div>

        <!-- Skills -->
        <div class="mb-10">
          <h2 class="text-2xl font-bold mb-4 border-b pb-2">Skills</h2>
          <div v-for="(skill, index) in data.skills" :key="'s'+index" class="bg-white p-6 rounded-lg shadow-sm border mb-6 relative">
            <button @click="removeSkill(index)" class="absolute top-4 right-4 text-red-500 hover:text-red-700">
              <i class='bx bx-trash text-xl'></i>
            </button>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-4">
    <!-- Editor Left Side -->
    <div class="col-span-1">
      <div class="grid grid-cols-1 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input v-model="skill.name" type="text" class="w-full border rounded p-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Icon (Boxicons class)</label>
                <div class="flex items-center">
                  <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                    <i :class="['bx', skill.icon, 'text-xl']"></i>
                  </div>
                  <input v-model="skill.icon" type="text" class="w-full border rounded-r p-2 h-10" placeholder="e.g. bx-code-block">
                </div>
              </div>
            </div>
            
            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea v-model="skill.description" rows="2" class="w-full border rounded p-2"></textarea>
            </div>
            
            <div class="mb-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">Tags</label>
              <div class="flex flex-wrap gap-2 mb-2">
                <div v-for="(tag, tIndex) in skill.tags" :key="'st'+tIndex" class="flex items-center bg-gray-100 border rounded pl-2">
                  <i :class="['bx', tag.icon, 'text-gray-500 mr-1']"></i>
                  <input v-model="tag.icon" placeholder="Icon class" class="w-24 bg-transparent text-xs outline-none py-1">
                  <input v-model="tag.name" placeholder="Name" class="w-24 bg-transparent text-xs font-semibold outline-none py-1 border-l pl-2">
                  <button @click="skill.tags.splice(tIndex, 1)" class="text-red-500 px-2 hover:bg-red-100 rounded-r"><i class='bx bx-x'></i></button>
                </div>
                <button @click="skill.tags.push({icon: '', name: ''})" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">+ Add Tag</button>
              </div>
            </div>
          </div>
          <button @click="addSkill" class="w-full border-2 border-dashed border-gray-300 text-gray-500 hover:border-blue-500 hover:text-blue-500 py-4 rounded-lg flex items-center justify-center font-medium transition">
            <i class='bx bx-plus text-xl mr-2'></i> Add New Skill
          </button>
        </div>

        <!-- End of Skill Editor -->
    </div>
    
    <!-- Skill Live Preview Right Side -->
    <div class="col-span-1 border-l pl-8 flex items-center justify-center bg-gray-50 rounded-r-lg">
      <div class="w-full max-w-sm">
        <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-4 text-center">Live Preview</p>
        <iframe :srcdoc="getSkillPreview(skill)" class="w-full h-[250px] border-0 bg-transparent rounded-lg shadow-sm overflow-hidden pointer-events-none"></iframe>
      </div>
    </div>
  </div>
  <!-- Projects -->
        <h2 class="text-2xl font-bold mb-4 border-b pb-2">Projects</h2>
        
        <div v-for="(project, index) in data.projects" :key="'p'+index" class="bg-white p-6 rounded-lg shadow-sm border mb-6 relative">
          <button @click="removeProject(index)" class="absolute top-4 right-4 text-red-500 hover:text-red-700">
            <i class='bx bx-trash text-xl'></i>
          </button>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
              <input v-model="project.title" type="text" class="w-full border rounded p-2">
            </div>
                      <div class="col-span-1 md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Project Screenshot</label>
            <div class="flex items-center gap-2">
              <input v-model="project.image" type="text" placeholder="URL or click Upload" class="flex-1 border rounded p-2 h-10">
              <button type="button" @click="openCropperTrigger(index, $event)" class="bg-gray-800 text-white hover:bg-gray-900 px-4 py-2 rounded h-10 text-sm whitespace-nowrap flex items-center shadow-sm">
                <i class='bx bx-cloud-upload text-lg mr-1'></i> Upload Image
              </button>
              <input type="file" accept="image/*" @change="onFileSelected($event, index)" class="hidden">
            </div>
          </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link (leave empty if none)</label>
              <input v-model="project.link" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link Text (e.g., View Project)</label>
              <input v-model="project.linkText" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Link Icon (Boxicons class)</label>
              <div class="flex items-center">
                <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                  <i :class="['bx', project.linkIcon, 'text-xl']"></i>
                </div>
                <input v-model="project.linkIcon" type="text" class="w-full border rounded-r p-2 h-10">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Status (e.g., Hibernating)</label>
              <input v-model="project.status" type="text" class="w-full border rounded p-2">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Card Icon (Boxicons class)</label>
              <div class="flex items-center">
                <div class="bg-gray-100 border border-r-0 rounded-l flex items-center justify-center w-10 h-10 text-gray-600">
                  <i :class="['bx', project.icon, 'text-xl']"></i>
                </div>
                <input v-model="project.icon" type="text" class="w-full border rounded-r p-2 h-10">
              </div>
            </div>
            <div class="flex items-center pt-6">
              <input v-model="project.featured" type="checkbox" class="mr-2 h-5 w-5 text-blue-600">
              <label class="text-sm font-medium text-gray-700">Featured (Shows Star badge)</label>
            </div>
          </div>
          
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea v-model="project.description" rows="3" class="w-full border rounded p-2"></textarea>
          </div>
          
          <div class="mb-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Technologies (Tags)</label>
            <div class="flex flex-wrap gap-2 mb-2">
              <div v-for="(tag, tIndex) in project.tags" :key="tIndex" class="flex items-center bg-gray-100 border rounded pl-2">
                <i :class="['bx', tag.icon, 'text-gray-500 mr-1']"></i>
                <input v-model="tag.icon" placeholder="Icon class" class="w-24 bg-transparent text-xs outline-none py-1">
                <input v-model="tag.name" placeholder="Name" class="w-24 bg-transparent text-xs font-semibold outline-none py-1 border-l pl-2">
                <button @click="project.tags.splice(tIndex, 1)" class="text-red-500 px-2 hover:bg-red-100 rounded-r"><i class='bx bx-x'></i></button>
              </div>
              <button @click="project.tags.push({icon: '', name: ''})" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">+ Add Tag</button>
            </div>
          </div>
          <!-- Project Live Preview Right Side -->
          <div class="col-span-1 border-l pl-8 flex flex-col items-center justify-center bg-gray-50 rounded-r-lg">
            <p class="text-xs text-gray-400 uppercase tracking-widest font-bold mb-4 text-center">Live Preview</p>
            <div class="w-full max-w-[380px] bg-slate-900 p-6 rounded-xl shadow-inner border border-slate-700 relative flex items-center justify-center">
              <iframe :srcdoc="getProjectPreview(project)" class="w-full h-[480px] border-0 bg-transparent overflow-hidden pointer-events-none scale-90 origin-top"></iframe>
            </div>
          </div>
        </div>
        
        <button @click="addProject" class="w-full border-2 border-dashed border-gray-300 text-gray-500 hover:border-blue-500 hover:text-blue-500 py-4 rounded-lg flex items-center justify-center font-medium transition">
          <i class='bx bx-plus text-xl mr-2'></i> Add New Project
        </button>
      </div>
    </div>

    <!-- Cropper Modal -->
    <div v-if="showCropper" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
      <div class="bg-white rounded-xl w-full max-w-4xl flex flex-col max-h-[90vh] shadow-2xl">
         <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
            <h3 class="text-xl font-bold text-gray-800"><i class='bx bx-crop mr-2'></i>Crop Project Screenshot (16:9)</h3>
            <button @click="closeCropper" class="text-gray-500 hover:text-red-500 transition"><i class='bx bx-x text-3xl'></i></button>
         </div>
         <div class="flex-1 overflow-hidden p-6 bg-gray-100 flex items-center justify-center min-h-[400px]">
            <img id="cropperImage" :src="cropperSrc" class="max-w-full max-h-[60vh] object-contain shadow-md rounded">
         </div>
         <div class="p-4 border-t flex justify-end gap-3 bg-gray-50 rounded-b-xl">
            <button @click="closeCropper" class="px-5 py-2.5 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition">Cancel</button>
            <button @click="uploadCroppedImage" :disabled="uploadingImage" class="px-5 py-2.5 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition flex items-center shadow">
               <i v-if="uploadingImage" class="bx bx-loader-alt bx-spin mr-2"></i>
               {{ uploadingImage ? 'Uploading to Firebase...' : 'Crop & Upload' }}
            </button>
         </div>
      </div>
    </div>
  </div>

  <!-- Load Firebase config -->
  <script src="/firebase-applet-config.json" id="firebase-config-json" type="application/json"></script>
  <script type="module">
    import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getStorage, ref as storageRef, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

    // Load Firebase Config dynamically
    fetch('/firebase-applet-config.json')
      .then(res => res.json())
      .then(firebaseConfig => {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
        const auth = getAuth(app);
        const storage = getStorage(app);

        createApp({
          setup() {
            const user = ref(null);
            const loading = ref(false);
            const saving = ref(false);
            const loginError = ref('');
            const data = ref({ projects: [], skills: [], contact: {} });

            // Image Upload & Cropping State
            const showCropper = ref(false);
            const cropperSrc = ref('');
            const uploadingImage = ref(false);
            let cropperInstance = null;
            const activeProjectIndex = ref(null);

            const openCropper = (index) => {
              const fileInput = document.querySelector('input[type="file"][data-idx="' + index + '"]') || Object.values(arguments[1] || {}).find(x => x && x.$el) || null;
              // using a trick: Vue template refs inside v-for are arrays, we can just trigger native click on the DOM element next to the button
            };

            const onFileSelected = (event, index) => {
              const file = event.target.files[0];
              if (!file) return;
              
              const reader = new FileReader();
              reader.onload = (e) => {
                cropperSrc.value = e.target.result;
                activeProjectIndex.value = index;
                showCropper.value = true;
                
                // Initialize cropper after DOM update
                setTimeout(() => {
                  const imageElement = document.getElementById('cropperImage');
                  if (cropperInstance) cropperInstance.destroy();
                  cropperInstance = new Cropper(imageElement, {
                    aspectRatio: 340 / 180, // strict 16:9 equivalent for the project cards
                    viewMode: 1,
                    autoCropArea: 1,
                  });
                }, 100);
              };
              reader.readAsDataURL(file);
              event.target.value = ''; // reset
            };

            const closeCropper = () => {
              showCropper.value = false;
              if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
              }
              cropperSrc.value = '';
            };

            const uploadCroppedImage = async () => {
              if (!cropperInstance || activeProjectIndex.value === null) return;
              
              uploadingImage.value = true;
              try {
                // Get cropped canvas as base64 string
                const canvas = cropperInstance.getCroppedCanvas({
                  width: 680,
                  height: 360,
                  imageSmoothingQuality: 'high'
                });
                const base64Image = canvas.toDataURL('image/jpeg', 0.85);
                
                // Upload to Firebase Storage
                const fileName = 'projects/project_' + Date.now() + '.jpg';
                const imageRef = storageRef(storage, fileName);
                
                await uploadString(imageRef, base64Image, 'data_url');
                const downloadURL = await getDownloadURL(imageRef);
                
                // Update Vue state
                data.value.projects[activeProjectIndex.value].image = downloadURL;
                
                closeCropper();
              } catch (e) {
                console.error("Upload error:", e);
                if (e.code === 'storage/unauthorized') {
                  alert("Upload Denied: You need to enable Firebase Storage rules in the Firebase Console!\n\n1. Go to Firebase Console > Storage\n2. Click 'Get Started'\n3. Set rules to allow authenticated users to write.");
                } else {
                  alert("Failed to upload image: " + e.message);
                }
              } finally {
                uploadingImage.value = false;
              }
            };

            // Live Preview Generators
            const getProjectPreview = (p) => {
              return `
                <html>
                  <head>
                    <link rel="stylesheet" href="/style.css">
                    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
                    <style>
                      body { 
                        margin: 0; padding: 20px; 
                        display: flex; align-items: center; justify-content: center; 
                        background: transparent; 
                        color: #f8fafc;
                        /* force light mode to be dark mode for preview box if needed */
                      }
                      .project-card { margin: 0; transform: scale(1.1); transform-origin: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
                    </style>
                  </head>
                  <body>
                    <div class="project-card glow-active">
                      <div class="project-image">
                        <img src="${p.image || 'https://via.placeholder.com/340x180?text=No+Image'}" alt="Preview">
                      </div>
                      <div class="project-card-header">
                        <div class="project-card-icon"><i class='bx ${p.icon || 'bx-code'}'></i></div>
                        <div class="project-card-links">
                          ${p.status ? `<span style="font-size:0.72rem; color:#f59e0b; background:rgba(255,165,0,0.15); padding:2px 7px; border-radius:999px; font-weight:600;"><i class='bx bx-moon'></i> ${p.status}</span>` : ''}
                          ${p.link ? `<a href="#" class="icon-link"><i class='bx ${p.linkIcon || 'bx-link'}'></i> ${p.linkText || 'Link'}</a>` : ''}
                        </div>
                      </div>
                      <h3 class="project-card-title">
                        ${p.title || 'Project Title'} 
                        ${p.featured ? `<span style="font-size:0.7rem; color:#14b8a6; border:1px solid #14b8a6; padding:2px 6px; border-radius:4px; margin-left:5px; vertical-align:middle;"><i class='bx bxs-star'></i> Featured</span>` : ''}
                      </h3>
                      <p class="project-card-desc">${p.description || 'Description'}</p>
                      <div class="project-card-tags">
                        ${(p.tags || []).map(t => `<span class="tag"><i class='bx ${t.icon}'></i> ${t.name}</span>`).join('')}
                      </div>
                    </div>
                  </body>
                </html>
              `;
            };

            const getSkillPreview = (s) => {
              return `
                <html>
                  <head>
                    <link rel="stylesheet" href="/style.css">
                    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
                    <style>
                      body { 
                        margin: 0; padding: 20px; 
                        display: flex; align-items: center; justify-content: center; 
                        background: #0f172a; /* Force dark bg for contrast */
                        border-radius: 12px;
                      }
                      .skill-card { margin: 0; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
                    </style>
                  </head>
                  <body>
                    <div class="skill-card animate-fade-up" style="opacity:1; transform:none;">
                      <div class="skill-icon"><i class='bx ${s.icon || 'bx-code'}'></i></div>
                      <div class="skill-name">${s.name || 'Skill Name'}</div>
                      <div class="skill-desc">${s.description || 'Description goes here'}</div>
                      <div class="skill-tags">
                        ${(s.tags || []).map(t => `<span class="tag"><i class='bx ${t.icon}'></i> ${t.name}</span>`).join('')}
                      </div>
                    </div>
                  </body>
                </html>
              `;
            };


            onMounted(() => {
              onAuthStateChanged(auth, (u) => {
                user.value = u;
                if (u) {
                  loadData();
                }
              });
            });

            const signIn = async () => {
              loginError.value = '';
              const provider = new GoogleAuthProvider();
              try {
                await signInWithPopup(auth, provider);
              } catch (e) {
                loginError.value = e.message;
              }
            };

            const signOut = async () => {
              await fbSignOut(auth);
              data.value = { projects: [], skills: [], contact: {} };
            };

            const loadData = async () => {
              loading.value = true;
              try {
                const docRef = doc(db, 'portfolio', 'data');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                  const fetchedData = docSnap.data();
                  if(fetchedData.projects) data.value.projects = fetchedData.projects;
                  if(fetchedData.skills) data.value.skills = fetchedData.skills;
                  if(fetchedData.contact) data.value.contact = fetchedData.contact;
                }
              } catch (e) {
                console.error('Failed to load data from Firebase', e);
                alert("Error loading data. Are you authorized? " + e.message);
              } finally {
                loading.value = false;
              }
            };

            const saveData = async () => {
              saving.value = true;
              try {
                const docRef = doc(db, 'portfolio', 'data');
                
                // Deep clone data to strip out vue proxies for firebase saving
                const pureData = JSON.parse(JSON.stringify(data.value));
                await setDoc(docRef, pureData);
                
                alert('Changes saved securely to Firebase!');
              } catch (e) {
                console.error(e);
                alert('Error saving data: ' + e.message);
              } finally {
                saving.value = false;
              }
            };

            const openCropperTrigger = (index, event) => {
              const input = event.target.nextElementSibling;
              if (input) input.click();
            };
            const addProject = () => {
              data.value.projects.push({
                title: '', image: '', link: '', linkText: '', linkIcon: '', status: '', description: '', tags: [], icon: '', featured: false
              });
            };

            const removeProject = (index) => {
              if(confirm('Are you sure you want to delete this project?')) {
                data.value.projects.splice(index, 1);
              }
            };

            const addSkill = () => {
              data.value.skills.push({ name: '', icon: '', description: '', tags: [] });
            };

            const removeSkill = (index) => {
              if(confirm('Are you sure you want to delete this skill?')) {
                data.value.skills.splice(index, 1);
              }
            };

            return {
              user,
              showCropper, cropperSrc, uploadingImage, onFileSelected, closeCropper, uploadCroppedImage, getProjectPreview, getSkillPreview, openCropperTrigger,
              loading,
              saving,
              loginError,
              data,
              signIn,
              signOut,
              saveData,
              addProject,
              removeProject,
              addSkill,
              removeSkill
            }
          }
        }).mount('#app');
      })
      .catch(e => {
        console.error("Could not load firebase config", e);
        document.body.innerHTML = "<h2 style='color:red; text-align:center; padding: 50px'>Failed to load Firebase Config</h2>";
      });
  </script>
</body>
</html>
